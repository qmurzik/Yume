name: AnimeApp
options:
  bundleIdPrefix: com.qmurzik
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ru

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

packages:
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 12.8.0

targets:
  AnimeApp:
    type: application
    platform: iOS
    sources:
      - path: AnimeApp
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qmurzik.animeapp
        PRODUCT_NAME: AnimeApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Аниме
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        YummyAppToken: $(YUMMY_APP_TOKEN)

  AnimeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnimeAppTests
        excludes:
          - Fixtures
      - path: AnimeAppTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AnimeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qmurzik.animeapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AnimeApp.app/AnimeApp
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  AnimeApp:
    build:
      targets:
        AnimeApp: all
        AnimeAppTests: [test]
    test:
      targets:
        - AnimeAppTests
      gatherCoverageData: false
    archive:
      config: Release
