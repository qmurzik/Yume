name: iOS - Build IPA

on:
  push:
    branches: [main, ios-anime]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SCHEME: AnimeApp
  PROJECT: AnimeApp.xcodeproj

jobs:
  build:
    name: Test and package unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The YummyAnime token is optional: without it the app simply hides that source.
      - name: Write secrets config
        env:
          YUMMY_APP_TOKEN: ${{ secrets.YUMMY_APP_TOKEN }}
        run: |
          if [ -n "$YUMMY_APP_TOKEN" ]; then
            printf 'YUMMY_APP_TOKEN = %s\n' "$YUMMY_APP_TOKEN" > Config/Secrets.xcconfig
            echo "YummyAnime token configured."
          else
            echo "No YUMMY_APP_TOKEN secret: building without the YummyAnime source."
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[-1].split("-") if x.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"])
          print(best[1])
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tee build-test.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tee test.log

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AnimeApp.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet 2>&1 | tee archive.log

      - name: Package IPA
        run: |
          APP=build/AnimeApp.xcarchive/Products/Applications/AnimeApp.app
          test -d "$APP" || { echo "AnimeApp.app not found in archive"; exit 1; }
          rm -rf Payload AnimeApp.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AnimeApp.ipa Payload
          ls -lh AnimeApp.ipa

      - name: Upload IPA artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AnimeApp-ipa
          path: AnimeApp.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AnimeApp.ipa
          generate_release_notes: true
