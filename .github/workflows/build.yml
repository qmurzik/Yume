name: Yume - Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: yume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble module APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # libxposed 102 requires compileSdk 37 (Android 17).
      - name: Install required Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" | sort -u || true
          "$SDKM" "platforms;android-37" "build-tools;36.0.0" "platform-tools" \
            || "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms"
          # Newer SDK packages may be named android-37.0; AGP looks for android-37.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.CANDY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/candy.jks"
            echo "CANDY_KEYSTORE=$RUNNER_TEMP/candy.jks" >> "$GITHUB_ENV"
          else
            echo "No CANDY_KEYSTORE_B64 secret: release APK will be signed with a throwaway debug key."
          fi

      - name: Assemble release APK
        env:
          CANDY_KEYSTORE_PASSWORD: ${{ secrets.CANDY_KEYSTORE_PASSWORD }}
          CANDY_KEY_ALIAS: ${{ secrets.CANDY_KEY_ALIAS }}
          CANDY_KEY_PASSWORD: ${{ secrets.CANDY_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Yume.apk

      # LSPosed finds the module only through these files; the libxposed API must be provided
      # by the framework at runtime, so it must not be packaged.
      - name: Verify APK layout
        run: |
          APK=app/build/outputs/apk/release/Yume.apk
          unzip -l "$APK" | grep -E "META-INF/xposed/|classes.*\.dex"
          for f in java_init.list module.prop scope.list; do
            echo "== $f"; unzip -p "$APK" "META-INF/xposed/$f" || { echo "missing $f"; exit 1; }
          done
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | tail -1)
          unzip -o -q "$APK" 'classes*.dex' -d dex
          CLASSES=$(for d in dex/*.dex; do "$DEXDUMP" "$d" | grep "Class descriptor"; done)
          echo "$CLASSES" | grep -q "Lcom/qmurzik/yacandy/hook/CandyModule;" || { echo "entry class missing"; exit 1; }
          echo "$CLASSES" | grep -q "Lio/github/libxposed/service/XposedService;" || { echo "service lib missing"; exit 1; }
          if echo "$CLASSES" | grep -q "Lio/github/libxposed/api/XposedInterface;"; then
            echo "libxposed api must be compileOnly"; exit 1
          fi
          echo "APK layout OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yume-apk
          path: app/build/outputs/apk/release/Yume.apk
          if-no-files-found: error
          retention-days: 30

  screenshots:
    name: Settings screenshots (emulator)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Yume-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/screenshots.sh apk/Yume.apk shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yume-screenshots
          path: shots
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    # Every push to main publishes (or refreshes) the release of the current versionName.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - name: Point the version tag at this commit
        run: |
          git tag -f "v${{ steps.version.outputs.name }}"
          git push -f origin "refs/tags/v${{ steps.version.outputs.name }}"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Yume-apk
          path: apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Yume ${{ steps.version.outputs.name }}
          body_path: .github/release-notes.md
          files: apk/Yume.apk
          make_latest: true
